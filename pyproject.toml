[project]
name = "authagent"
version = "0.1.0"
description = "Cost-aware agentic RAG for prior authorization with a self-trained verifier cascade"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
app = [
    "gradio>=4.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
